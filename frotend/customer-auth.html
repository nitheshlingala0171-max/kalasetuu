
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer - Kalasetu</title>

    <link rel="stylesheet" href="customer-auth.css">
</head>

<body>

    <div class="auth-page">

        <div class="overlay"></div>

        <div class="auth-container">

            <!-- Logo -->
            <div class="logo-circle">
                <img src="images/kalasetu-logo.png" alt="Kalasetu">
            </div>

            <h1>KALASETU</h1>

            <div class="tagline">
                <span></span>
                <p>TRADITION • CRAFT • STORY</p>
                <span></span>
            </div>

            <!-- Authentication Card -->
            <div class="auth-card">

                <p class="welcome" data-i18n="welcomeBack">
                    WELCOME BACK
                </p>

                <h2 data-i18n="customerLogin">
                    Customer Login
                </h2>

                <p class="sub-text" data-i18n="customerDescription">
                    Discover beautiful handmade crafts and stories.
                </p>

                <form id="customerForm">

                    <div class="input-group">
                        <label for="email" data-i18n="emailOrPhone">
                            Email or Phone
                        </label>

                        <input
                            type="text"
                            id="email"
                            data-i18n-placeholder="enterEmailPhone"
                        >
                    </div>

                    <div class="input-group">
                        <label for="password" data-i18n="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            data-i18n-placeholder="enterPassword"
                        >
                    </div>

                    <div class="options">

                        <label class="remember">
                            <input type="checkbox">
                            <span data-i18n="rememberMe">Remember me</span>
                        </label>

                        <a href="#" id="forgotPassword" data-i18n="forgotPassword">
                            Forgot Password?
                        </a>

                    </div>

                    <button type="submit">
                        <span data-i18n="login">LOGIN</span>
                        <span>→</span>
                    </button>

                </form>

                <div class="divider">
                    <span></span>
                    <span data-i18n="or">OR</span>
                    <span></span>
                </div>

                <p class="register-text">
                    <span data-i18n="newToKalasetu">New to Kalasetu?</span>

                    <a href="customer-register.html"
                       id="registerLink"
                       data-i18n="createAccount">
                        Create an account
                    </a>
                </p>

            </div>

            <p class="bottom-text" data-i18n="handmadeTagline">
                HANDMADE WITH TRADITION • CONNECTED THROUGH STORIES
            </p>

        </div>

    </div>

    <!-- Translation file must load before page JavaScript -->
    <script src="translations.js"></script>
    <script src="customer-auth.js"></script>

</body>
</html>
