
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Select Language | Kalasetu</title>

    <link rel="stylesheet" href="language.css">
</head>

<body>

    <header class="header">
        <div class="brand">
            <img src="images/kalasetu-logo.png" alt="Kalasetu Logo">
            <div>
                <h1>Kalasetu</h1>
                <p>TRADITION • CRAFT • STORY</p>
            </div>
        </div>
    </header>

    <main class="language-container">

        <h2>Select Your Language</h2>
        <p>Choose your preferred language to continue</p>

        <div class="language-grid">

            <button onclick="selectLanguage('en')">
                English
            </button>

            <button onclick="selectLanguage('te')">
                తెలుగు
            </button>

            <button onclick="selectLanguage('hi')">
                हिन्दी
            </button>

            <button onclick="selectLanguage('ta')">
                தமிழ்
            </button>

            <button onclick="selectLanguage('kn')">
                ಕನ್ನಡ
            </button>

            <button onclick="selectLanguage('ml')">
                മലയാളം
            </button>

            <button onclick="selectLanguage('mr')">
                मराठी
            </button>

            <button onclick="selectLanguage('bn')">
                বাংলা
            </button>

            <button onclick="selectLanguage('gu')">
                ગુજરાતી
            </button>

            <button onclick="selectLanguage('pa')">
                ਪੰਜਾਬੀ
            </button>

        </div>

        <button class="continue-btn" onclick="continueToSite()">
            Continue →
        </button>

    </main>

    <script src="language.js"></script>

</body>
</html>
