<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kalasetu - Admin Login</title>

    <link rel="stylesheet" href="admin-login.css">
</head>

<body>

<div class="admin-container">

    <div class="admin-card">

        <div class="logo-area">
            <img src="images/kalasetu-logo.png" alt="Kalasetu Logo">
        </div>

        <p class="brand-name">KALASETU</p>
        <p class="brand-tagline">TRADITION • CRAFT • STORY</p>

        <div class="title-section">
            <p class="small-title">ADMINISTRATOR</p>
            <h1>Admin Login</h1>
            <p>Sign in to manage the Kalasetu platform.</p>
        </div>

        <form id="adminLoginForm">

            <div class="input-group">
                <label for="adminEmail">Email Address</label>
                <input
                    type="email"
                    id="adminEmail"
                    placeholder="Enter admin email"
                    required
                >
            </div>

            <div class="input-group">
                <label for="adminPassword">Password</label>

                <div class="password-box">
                    <input
                        type="password"
                        id="adminPassword"
                        placeholder="Enter password"
                        required
                    >

                    <button
                        type="button"
                        id="togglePassword"
                        aria-label="Show password"
                    >
                        Show
                    </button>
                </div>
            </div>

            <button type="submit" class="login-btn">
                LOGIN TO ADMIN PANEL
                <span>→</span>
            </button>

        </form>

        <p id="loginMessage" class="login-message"></p>

        <button class="back-btn" onclick="goBack()">
            ← BACK
        </button>

    </div>

    <footer>
        HANDMADE WITH TRADITION • CONNECTED THROUGH STORIES
    </footer>

</div>

<script src="admin-login.js"></script>

</body>
</html>
