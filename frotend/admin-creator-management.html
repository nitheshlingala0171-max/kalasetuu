<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Kalasetu - Manage Creators</title>

    <link
        rel="stylesheet"
        href="admin-creator-management.css"
    >

</head>


<body>

<div class="admin-page">


    <!-- HEADER -->

    <header class="admin-header">

        <div class="brand">

            <img
                src="images/kalasetu-logo.png"
                alt="Kalasetu"
            >

            <div>

                <h1>KALASETU</h1>

                <p>
                    ADMIN • CREATOR MANAGEMENT
                </p>

            </div>

        </div>


        <button
            class="back-btn"
            onclick="goDashboard()"
        >
            ← Dashboard
        </button>

    </header>



    <!-- MAIN -->

    <main class="content">


        <!-- HEADING -->

        <div class="page-heading">

            <p class="eyebrow">
                CREATOR MANAGEMENT
            </p>

            <h2>
                Manage Creators
            </h2>

            <p>
                View and manage verified Kalasetu creators.
            </p>

        </div>



        <!-- SUMMARY -->

        <section class="summary-grid">

            <div class="summary-card">

                <span>
                    Total Creators
                </span>

                <strong id="totalCreators">
                    0
                </strong>

            </div>


            <div class="summary-card">

                <span>
                    Approved
                </span>

                <strong id="approvedCreators">
                    0
                </strong>

            </div>


            <div class="summary-card">

                <span>
                    Pending
                </span>

                <strong id="pendingCreators">
                    0
                </strong>

            </div>

        </section>



        <!-- SEARCH -->

        <div class="search-section">

            <input
                type="text"
                id="creatorSearch"
                placeholder="Search creators by name or craft..."
                oninput="searchCreators()"
            >

        </div>



        <!-- CREATOR LIST -->

        <section>

            <div
                id="creatorsList"
                class="creators-list"
            ></div>


            <!-- EMPTY STATE -->

            <div
                id="emptyState"
                class="empty-state"
            >

                <div class="empty-icon">
                    ♧
                </div>

                <h3>
                    No Creators Found
                </h3>

                <p>
                    Approved creators will appear here.
                </p>

            </div>

        </section>


    </main>



    <!-- FOOTER -->

    <footer>

        <p>
            © 2026 Kalasetu • Admin Panel
        </p>

    </footer>


</div>


<script src="admin-creator-management.js"></script>

</body>

</html>
